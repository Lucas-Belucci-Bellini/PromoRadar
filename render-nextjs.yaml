services:
  - type: web
    name: promoradar-web
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm install --prefix apps/web && npm run build --prefix apps/web
    startCommand: npm start --prefix apps/web
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SITE_URL
        value: https://promoradar-web.onrender.com
      - key: NEXT_PUBLIC_AFFILIATE_ACTIVE
        value: "false"
