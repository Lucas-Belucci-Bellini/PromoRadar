services:
  - type: web
    name: promoradar
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SITE_URL
        value: https://promoradar.onrender.com
      - key: NEXT_PUBLIC_AFFILIATE_ACTIVE
        value: "false"
